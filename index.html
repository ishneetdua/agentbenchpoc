<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Generation Service</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }
        
        input[type="text"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
            font-family: inherit;
        }
        
        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        textarea {
            min-height: 120px;
            resize: vertical;
        }
        
        .upload-area {
            border: 2px dashed #e0e0e0;
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #f9f9f9;
        }
        
        .upload-area:hover {
            border-color: #667eea;
            background: #f0f0ff;
        }
        
        .upload-area.dragover {
            border-color: #667eea;
            background: #e8e8ff;
        }
        
        .upload-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        
        .upload-text {
            color: #666;
            font-size: 14px;
        }
        
        .file-list {
            margin-top: 15px;
        }
        
        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 6px;
            margin-bottom: 8px;
        }
        
        .file-name {
            font-size: 13px;
            color: #333;
        }
        
        .file-remove {
            background: #ff4444;
            color: white;
            border: none;
            padding: 4px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .submit-btn:hover {
            transform: translateY(-2px);
        }
        
        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .status.loading {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        
        .download-links {
            margin-top: 15px;
        }
        
        .download-link {
            display: block;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 6px;
            margin-bottom: 8px;
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }
        
        .download-link:hover {
            background: #e9ecef;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Website Generation Service</h1>
        <p class="subtitle">Describe your website and upload any design mockups or images</p>
        
        <form id="websiteForm">
            <div class="form-group">
                <label for="customerId">Your Email or ID</label>
                <input type="text" id="customerId" placeholder="your-email@example.com" required>
            </div>
            
            <div class="form-group">
                <label for="jobDescription">Website Description</label>
                <textarea id="jobDescription" placeholder="Describe the website you need... Include pages, features, design preferences, etc." required></textarea>
            </div>
            
            <div class="form-group">
                <label>Attachments (Images, Mockups)</label>
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📎</div>
                    <div class="upload-text">
                        <strong>Click to upload</strong> or drag and drop<br>
                        <small>PNG, JPG, GIF up to 10MB each</small>
                    </div>
                    <input type="file" id="fileInput" multiple accept="image/*" style="display: none;">
                </div>
                <div class="file-list" id="fileList"></div>
            </div>
            
            <button type="submit" class="submit-btn" id="submitBtn">Generate Website</button>
        </form>
        
        <div class="status" id="status"></div>
    </div>

    <script>
        const API_ENDPOINT = 'https://4mh4zy4oid.execute-api.us-east-1.amazonaws.com/prod/generate';
        
        let selectedFiles = [];
        
        // Upload area interactions
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');
        
        uploadArea.addEventListener('click', () => fileInput.click());
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });
        
        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });
        
        function handleFiles(files) {
            for (let file of files) {
                if (file.size > 10 * 1024 * 1024) {
                    showStatus('error', `File ${file.name} is too large (max 10MB)`);
                    continue;
                }
                selectedFiles.push(file);
            }
            updateFileList();
        }
        
        function updateFileList() {
            fileList.innerHTML = '';
            selectedFiles.forEach((file, index) => {
                const fileItem = document.createElement('div');
                fileItem.className = 'file-item';
                fileItem.innerHTML = `
                    <span class="file-name">${file.name} (${formatFileSize(file.size)})</span>
                    <button type="button" class="file-remove" onclick="removeFile(${index})">Remove</button>
                `;
                fileList.appendChild(fileItem);
            });
        }
        
        function removeFile(index) {
            selectedFiles.splice(index, 1);
            updateFileList();
        }
        
        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }
        
        // Form submission
        document.getElementById('websiteForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const customerId = document.getElementById('customerId').value;
            const jobDescription = document.getElementById('jobDescription').value;
            const submitBtn = document.getElementById('submitBtn');
            
            submitBtn.disabled = true;
            showStatus('loading', '⏳ Processing your request... This may take 10-15 minutes.');
            
            try {
                // Convert files to base64
                const attachments = await Promise.all(
                    selectedFiles.map(file => fileToBase64(file))
                );
                
                // Submit to API
                const response = await fetch(API_ENDPOINT, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        customer_id: customerId,
                        job_description: jobDescription,
                        attachments: attachments
                    })
                });
                
                const result = await response.json();
                
                if (!response.ok) {
                    throw new Error(result.error || 'Request failed');
                }
                
                // Show success with the generated prompt
                let message = `✅ Website generation started!<br><br>`;
                message += `<strong>Request ID:</strong> ${result.request_id}<br>`;
                message += `<strong>Status:</strong> ${result.message}<br>`;
                message += `<strong>Estimated Time:</strong> ${result.estimated_time || '10-15 minutes'}<br><br>`;
                message += `<strong>Prompt Used:</strong><br>`;
                message += `<div style="background: #f5f5f5; padding: 15px; border-radius: 6px; margin-top: 10px; max-height: 400px; overflow-y: auto; text-align: left; white-space: pre-wrap; font-family: monospace; font-size: 12px;" id="promptText">${result.prompt || 'No prompt generated'}</div>`;
                message += `<button onclick="copyPrompt()" style="margin-top: 10px; padding: 8px 16px; background: #667eea; color: white; border: none; border-radius: 6px; cursor: pointer;">📋 Copy Prompt</button>`;
                message += `<br><br><small>💌 You will receive an email notification with download links when your website is ready.</small>`;
                
                showStatus('success', message);
                
                // Reset form
                document.getElementById('websiteForm').reset();
                selectedFiles = [];
                updateFileList();
                
            } catch (error) {
                showStatus('error', `❌ Error: ${error.message}`);
            } finally {
                submitBtn.disabled = false;
            }
        });
        
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => {
                    const base64 = reader.result.split(',')[1];
                    resolve({
                        filename: file.name,
                        content: base64,
                        type: file.type
                    });
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }
        
        function showStatus(type, message) {
            const status = document.getElementById('status');
            status.className = `status ${type}`;
            status.innerHTML = message;
            status.style.display = 'block';
        }
        
        function copyPrompt() {
            const promptText = document.getElementById('promptText').textContent;
            navigator.clipboard.writeText(promptText).then(() => {
                alert('Prompt copied to clipboard!');
            });
        }
    </script>
</body>
</html>
